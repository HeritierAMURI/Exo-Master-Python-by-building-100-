<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#25231f">
    <title>{{ title|default("Cafe & Wifi", true) }} | Cafe &amp; Wifi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark site-navbar">
            <div class="container">
                <a class="navbar-brand fw-semibold" href="{{ url_for('home') }}">
                    <i class="bi bi-cup-hot-fill me-2" aria-hidden="true"></i>Cafe &amp; Wifi
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#mainNavigation" aria-controls="mainNavigation"
                        aria-expanded="false" aria-label="Ouvrir le menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavigation">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('home') }}">Accueil</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('add_cafe') }}">
                                <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Ajouter un café
                            </a>
                        </li>
                    </ul>
                    <form class="d-flex search-form ms-lg-3 mt-3 mt-lg-0"
                          action="{{ url_for('search') }}" method="get" role="search">
                        <label class="visually-hidden" for="siteSearch">Nom ou quartier</label>
                        <input class="form-control" id="siteSearch" type="search" name="location"
                               value="{{ location|default('', true) }}"
                               placeholder="Café ou quartier">
                        <button class="btn btn-accent ms-2" type="submit" aria-label="Rechercher">
                            <i class="bi bi-search" aria-hidden="true"></i>
                        </button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4 py-lg-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button class="btn-close" type="button" data-bs-dismiss="alert"
                            aria-label="Fermer"></button>
                </div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer mt-auto py-4">
        <div class="container text-center">
            <small>Des cafés accueillants pour travailler et savourer un bon café.</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
